name: V14b frozen ternary phase surface locked run

on:
  push:
    branches:
      - feature/v14b-frozen-ternary-phase-surface
    paths:
      - .github/v14b_frozen_ternary_phase_surface_once

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install 'numpy==2.4.6'
      - name: Verify one-shot marker and frozen contracts
        run: |
          test "$(cat .github/v14b_frozen_ternary_phase_surface_once)" = "RUN_ONCE_V14B_FROZEN_TERNARY_PHASE_SURFACE_V2"
          pytest -q tests/test_ternary_decision_v14b.py tests/test_target_observer_v14b.py tests/test_nuisance_observer_v14b.py
          python - <<'PY'
          import json
          p=json.load(open('benchmarks/v14b_frozen_ternary_phase_surface_protocol.json'))
          assert p['alpha']==0.05
          assert p['frozen_nuisance_threshold']==4.33898869355123e-06
          assert p['freeze_rules']['observer_changes_forbidden'] is True
          assert p['freeze_rules']['threshold_changes_forbidden'] is True
          assert len(p['measurement_seeds'])==32
          PY
      - name: Run frozen phase-surface measurement exactly once
        run: |
          mkdir -p v14b_ternary_output
          python scripts/run_v14b_frozen_ternary_phase_surface.py \
            --output v14b_ternary_output/phase_surface.json \
            > v14b_ternary_output/summary.json
      - name: Build immutable receipt
        run: |
          python - <<'PY'
          import hashlib,json,platform,numpy as np,os
          files=[
            'benchmarks/v14b_frozen_ternary_phase_surface_protocol.json',
            'scripts/run_v14b_frozen_ternary_phase_surface.py',
            'src/interaction_sensing/ternary_decision_v14b.py',
            'src/interaction_sensing/target_observer_v14b.py',
            'src/interaction_sensing/nuisance_observer_v14b.py',
            'v14b_ternary_output/phase_surface.json',
          ]
          def h(path):
            x=hashlib.sha256()
            with open(path,'rb') as f:
              for b in iter(lambda:f.read(1024*1024),b''): x.update(b)
            return x.hexdigest()
          r={
            'schema':'insepi-v14b-frozen-ternary-phase-surface-receipt-v1',
            'execution_commit':os.environ.get('GITHUB_SHA'),
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'python':platform.python_version(),
            'numpy':np.__version__,
            'sha256':{p:h(p) for p in files},
          }
          json.dump(r,open('v14b_ternary_output/receipt.json','w'),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v14b-frozen-ternary-phase-surface-first-run
          path: v14b_ternary_output/
          if-no-files-found: error
          compression-level: 9
