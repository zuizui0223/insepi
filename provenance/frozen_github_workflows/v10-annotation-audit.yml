name: V10 annotation provenance audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-small-reference-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-extract small result/reference artifacts only
        run: python scripts/extract_v10_annotation_evidence.py
      - name: Audit no-video/no-observer boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('.v10/annotation-audit/manifest.json').read_text())
          assert manifest['schema'] == 'interaction-sensing-v10-annotation-audit-extraction-v1'
          assert len(manifest['extracted_files']) == 4
          assert manifest['video_pixels_accessed'] is False
          assert manifest['observer_execution'] is False
          assert manifest['v7_materialisation'] is False
          assert not Path('.v7/run/v7_pixels.npz').exists()
          print('V10_ANNOTATION_EXTRACTION_ONLY true')
          print('V10_VIDEO_PIXELS_ACCESSED false')
          print('V10_OBSERVER_EXECUTION false')
          PY
      - name: Upload annotation-provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: v10-annotation-provenance-audit
          path: .v10/annotation-audit/
          if-no-files-found: error
          retention-days: 30
