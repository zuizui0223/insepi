name: V10 frozen real-pixel materialisation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rematerialise-only-to-verify-canonical-bytes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen materialisation dependencies
        run: python -m pip install numpy==2.4.6 imageio-ffmpeg==0.6.0 pytest
      - name: Verify frozen V10 implementation contracts
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_real_video_v10.py tests/test_v10_real_video_protocol.py
      - name: Re-materialise only for byte-identity verification
        env:
          PYTHONPATH: src:scripts
        run: python scripts/materialize_v10_real_pixels.py
      - name: Require exact canonical artifact identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.v10/pixels')
          receipt = json.loads((root / 'v10_real_pixel_receipt.json').read_text())
          freeze = json.loads(Path('benchmarks/v10_real_pixel_artifact_freeze.json').read_text())
          assert receipt['protocol_sha256'] == freeze['protocol_sha256']
          assert receipt['files']['pixel_npz_sha256'] == freeze['artifact']['pixel_npz_sha256']
          assert receipt['array_contract']['backgrounds_raw_sha256'] == freeze['artifact']['backgrounds_raw_sha256']
          assert receipt['array_contract']['frames_raw_sha256'] == freeze['artifact']['frames_raw_sha256']
          assert receipt['files']['base_registry_sha256'] == freeze['artifact']['base_registry_sha256']
          assert receipt['files']['variant_registry_sha256'] == freeze['artifact']['variant_registry_sha256']
          assert receipt['files']['condition_registry_sha256'] == freeze['artifact']['condition_registry_sha256']
          assert receipt['files']['panel_registry_sha256'] == freeze['artifact']['panel_registry_sha256']
          assert hashlib.sha256((root / 'v10_real_pixel_artifact.npz').read_bytes()).hexdigest() == freeze['artifact']['pixel_npz_sha256']
          assert receipt['observer_execution'] is False
          assert receipt['v7_materialisation'] is False
          print('V10_PIXEL_ARTIFACT_MATCHES_CANONICAL_FREEZE true')
          print('V10_OBSERVER_EXECUTION false')
          PY
      - name: Upload verification artifact only
        uses: actions/upload-artifact@v4
        with:
          name: v10-frozen-real-pixel-artifact-verification
          path: .v10/pixels/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
