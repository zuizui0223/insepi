name: V10 protocol preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner only
        run: python -m pip install pytest
      - name: Validate frozen V10 protocol contracts
        run: pytest -q tests/test_v10_real_video_protocol.py
      - name: Require exact frozen protocol identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('benchmarks/v10_real_video_protocol.json')
          freeze = json.loads(Path('benchmarks/v10_real_video_protocol_freeze.json').read_text())
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == freeze['protocol_sha256'] == 'c84947c998f69d4c8f2d056e79c7f91c6c6736b938236c17386618ac5a924e03'
          print('V10_PROTOCOL_MATCHES_FREEZE true')
          print('V10_PROTOCOL_SHA256', digest)
          print('V10_OBSERVER_EXECUTION false')
          PY
