name: V14a2 prefreeze receipt

on:
  pull_request:
    paths:
      - "benchmarks/v14a2_spatiotemporal_world_protocol.json"
      - "src/interaction_sensing/simulation/dimensionless_observability_v14a2.py"
      - "src/interaction_sensing/simulation/v14a2_sweep.py"
      - "scripts/run_v14a2_spatiotemporal_sweep.py"
      - "scripts/build_v14a2_prefreeze_receipt.py"
      - "tests/test_dimensionless_observability_v14a2.py"
      - "tests/test_dimensionless_observability_v14a2_semantics.py"
      - "tests/test_v14a2_locked_runner.py"
      - ".github/workflows/v14a2-prefreeze.yml"
  workflow_dispatch:

jobs:
  prefreeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install frozen V14a2 prefreeze runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" -e ".[dev]"
      - name: Verify frozen runtime
        run: |
          python - <<'PY'
          import platform, numpy as np
          assert platform.python_version() == "3.11.16"
          assert np.__version__ == "2.4.6"
          print(platform.python_version(), np.__version__)
          PY
      - name: Run V14a2 pre-sweep contract tests only
        run: |
          pytest -q \
            tests/test_dimensionless_observability_v14a2.py \
            tests/test_dimensionless_observability_v14a2_semantics.py \
            tests/test_v14a2_locked_runner.py
      - name: Build receipt candidate without scientific sweep
        run: |
          python scripts/build_v14a2_prefreeze_receipt.py \
            --output .v14a2/prefreeze_receipt_candidate.json
      - name: Upload prefreeze receipt candidate
        uses: actions/upload-artifact@v4
        with:
          name: v14a2-prefreeze-receipt-candidate
          path: .v14a2/prefreeze_receipt_candidate.json
