name: V6 portfolio development

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run V6 tests
        run: |
          pytest -q \
            tests/test_observer_portfolio_v6.py \
            tests/test_portfolio_development_v6.py \
            tests/test_portfolio_fit_v6.py \
            tests/test_portfolio_sparse_v6.py \
            tests/test_portfolio_screening_v6b.py \
            tests/test_portfolio_single_arm_v6.py
      - name: Screen sparse and budget-conditioned portfolios
        run: |
          python - <<'PY'
          from collections import Counter, defaultdict
          from interaction_sensing.simulation.portfolio_screening_v6b import run_v6b_screening

          report = run_v6b_screening(
              'benchmarks/pollipi_factorial_v4_5541201.tsv',
              fit_world_windows=400,
              fit_replicates=3,
              eval_world_windows=1200,
              eval_replicates=20,
              seed=20260821,
          )
          print('V6B_POLLIPI_SOURCE', report.pollipi_source_commit)
          print('V6B_WORLD', report.world_fingerprint)
          print('V6B_FORCED_FIT', report.forced_fit.to_dict())
          print('V6B_SPARSE_FIT', report.sparse_fit.to_dict())
          print('V6B_BUDGET_SCHEDULE', report.budget_schedule.to_dict())

          counts = Counter()
          regimes = defaultdict(list)
          for row in report.results:
              if row.pareto:
                  counts[row.method] += 1
                  regimes[row.method].append((row.prevalence, row.budget_fraction))
              print(
                  'V6B_DEV',
                  f'p={row.prevalence:.2f}',
                  f'b={row.budget_fraction:.2f}',
                  row.method,
                  f'event={row.true_event_recall:.3f}',
                  f'error={row.hidden_error_recall:.3f}',
                  f'cpe={row.captures_per_hidden_error:.3f}',
                  f'tv={row.disturbance_tv_distance:.3f}',
                  f'pareto={int(row.pareto)}',
              )
          print('V6B_PARETO_COUNTS', dict(sorted(counts.items())))
          for method in ('v6_sparse', 'v6_budget_conditioned', 'v6_forced_four_arm'):
              print('V6B_FRONTIER_REGIMES', method, sorted(regimes.get(method, [])))
          PY
      - name: Screen minimal exploration plus one exploitation arm
        run: |
          python - <<'PY'
          from collections import Counter
          from interaction_sensing.simulation.portfolio_screening_v6c import run_v6c_screening

          report = run_v6c_screening(
              'benchmarks/pollipi_factorial_v4_5541201.tsv',
              fit_world_windows=400,
              fit_replicates=3,
              eval_world_windows=1200,
              eval_replicates=20,
              seed=20260821,
          )
          print('V6C_FIT', report.fit.to_dict())
          print('V6C_EXPLOITATION_ARM', report.exploitation_arm)
          counts = Counter(row.method for row in report.results if row.pareto)
          for row in report.results:
              print(
                  'V6C_DEV',
                  f'p={row.prevalence:.2f}',
                  f'b={row.budget_fraction:.2f}',
                  row.method,
                  f'event={row.true_event_recall:.3f}',
                  f'error={row.hidden_error_recall:.3f}',
                  f'cpe={row.captures_per_hidden_error:.3f}',
                  f'tv={row.disturbance_tv_distance:.3f}',
                  f'pareto={int(row.pareto)}',
              )
          print('V6C_PARETO_COUNTS', dict(sorted(counts.items())))
          PY
