name: V14b target observer locked validation

on:
  push:
    branches:
      - feature/v14b-target-observer-direct-first
    paths:
      - ".github/v14b_target_observer_validation_once"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install frozen validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" -e ".[dev]"
      - name: Verify marker and contract
        run: |
          test "$(cat .github/v14b_target_observer_validation_once)" = "RUN_ONCE_V14B_TARGET_DIRECT_FIRST"
          pytest -q tests/test_target_observer_v14b.py
      - name: Run fixed 32-seed target-side validation exactly once
        run: |
          python scripts/run_v14b_target_observer_direct_first_validation.py --output .v14b/target_direct_first_validation.json
      - name: Build immutable validation receipt
        run: |
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          import numpy as np
          out=Path('.v14b/target_direct_first_validation.json')
          payload=json.loads(out.read_text())
          receipt={
            'schema':'insepi-v14b-target-observer-direct-first-validation-receipt-v1',
            'execution_commit':os.environ['GITHUB_SHA'],
            'runtime':{'python':platform.python_version(),'numpy':np.__version__},
            'validation_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
            'all_invariants_hold':payload['all_invariants_hold'],
            'target_side_type_saturated':payload['target_side_type_saturated'],
            'new_contradiction_type_count':payload['new_contradiction_type_count'],
            'nuisance_observer_modified':payload['nuisance_observer_modified'],
          }
          p=Path('.v14b/target_direct_first_validation_receipt.json')
          p.write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          PY
      - name: Upload immutable target validation
        uses: actions/upload-artifact@v4
        with:
          name: v14b-target-observer-direct-first-validation
          path: .v14b/
