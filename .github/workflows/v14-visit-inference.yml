name: V14 target-nuisance-observability benchmark

on:
  pull_request:
    paths:
      - "benchmarks/v14_**"
      - "src/interaction_sensing/observation_triad.py"
      - "src/interaction_sensing/nuisance_effects.py"
      - "src/interaction_sensing/visit_observation.py"
      - "src/interaction_sensing/simulation/visit_inference_v14.py"
      - "scripts/run_v14_visit_inference_benchmark.py"
      - "tests/test_observation_triad.py"
      - "tests/test_nuisance_effects.py"
      - "tests/test_visit_observation.py"
      - "tests/test_visit_inference_v14.py"
      - ".github/workflows/v14-visit-inference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v14-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development test tools
        run: python -m pip install -e ".[dev]"
      - name: Verify V14 triad and visit-observation contracts
        run: |
          pytest -q \
            tests/test_observation_triad.py \
            tests/test_nuisance_effects.py \
            tests/test_visit_observation.py \
            tests/test_visit_inference_v14.py
      - name: Run full preregistered V14 development benchmark twice
        run: |
          mkdir -p benchmarks/generated .v14-repeat
          python scripts/run_v14_visit_inference_benchmark.py \
            --output benchmarks/generated/v14_visit_inference_result.json | tee benchmarks/generated/v14_console.txt
          python scripts/run_v14_visit_inference_benchmark.py \
            --output .v14-repeat/v14_visit_inference_result.json > .v14-repeat/console.txt
          cmp benchmarks/generated/v14_visit_inference_result.json .v14-repeat/v14_visit_inference_result.json
          echo "V14_BYTE_DETERMINISM PASS"
      - name: Write V14 summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('benchmarks/generated/v14_visit_inference_result.json').read_text())
          print('# V14 target–nuisance–observability development benchmark')
          print()
          for name, metrics in report['policy_metrics'].items():
              print(
                  f"- **{name}**: false absence={metrics['false_absence_rate_among_true_visits']:.4f}; "
                  f"unobservable denominator contamination={metrics['unobservable_denominator_contamination']:.4f}; "
                  f"observable retention={metrics['observable_opportunity_retention']:.4f}"
              )
          print()
          print('No scalar winner is computed. This is development evidence, not field visit validation.')
          PY
      - name: Upload V14 development evidence
        uses: actions/upload-artifact@v4
        with:
          name: v14-visit-inference-development
          path: |
            benchmarks/generated/v14_visit_inference_result.json
            benchmarks/generated/v14_console.txt
            benchmarks/v14_visit_inference_benchmark.json
            benchmarks/v14_observation_triad_contract.json
          if-no-files-found: error
          retention-days: 90
