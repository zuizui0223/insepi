name: V10 real-video source resolution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve Figshare file metadata without downloading video bytes
        run: python scripts/resolve_v10_figshare_source.py
      - name: Index Honeybee and nested Scaevola ZIPs by HTTP Range only
        run: python scripts/index_v10_remote_zip.py
      - name: Index Experiment Data ZIP by HTTP Range only
        run: |
          python scripts/index_v10_remote_zip.py \
            --archive-name Experiment_Data.zip \
            --nested-name __no_nested_target__ \
            --output .v10/experiment-data-index.json \
            > .v10/experiment-data-index.log
      - name: Stream-index the small Experiment 1 test-video bundle
        run: python scripts/index_v10_deflated_test_bundle.py
      - name: Audit source-resolution boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('.v10/source-resolution.json').read_text())
          honey = json.loads(Path('.v10/honeybee-videos-index.json').read_text())
          experiment = json.loads(Path('.v10/experiment-data-index.json').read_text())
          tests = json.loads(Path('.v10/experiment-test-videos-index.json').read_text())
          assert source['schema'] == 'interaction-sensing-v10-source-resolution-v1'
          assert source['source']['article_id'] == 12895433
          assert source['source']['doi'].lower() == '10.26180/5f4c8d5815940'
          assert source['file_count'] == 5
          for index in (honey, experiment):
              assert index['schema'] == 'interaction-sensing-v10-remote-zip-index-v2'
              assert index['http_range_only'] is True
              assert index['member_payload_downloaded'] is False
              assert index['bytes_requested_for_index'] < 32 * 1024 * 1024
          assert tests['schema'] == 'interaction-sensing-v10-deflated-test-bundle-index-v1'
          assert tests['streaming_resolution']['compressed_payload_bytes_streamed'] < 600 * 1024 * 1024
          assert tests['streaming_resolution']['crc32_verified'] is True
          assert tests['streaming_resolution']['decompressed_member_payload_written'] is False
          assert tests['nested_zip']['video_count'] == 7
          assert tests['bee_test_count'] == 7
          assert not Path('.v10/video-bytes').exists()
          assert not Path('.v7/run/v7_pixels.npz').exists()
          print('V10_SOURCE_ONLY true')
          print('V10_VIDEO_MEMBERS_WRITTEN false')
          print('V10_REMOTE_ZIP_RANGE_ONLY true')
          print('V10_TEST_BUNDLE_VIDEOS', tests['nested_zip']['video_count'])
          print('V10_TEST_BUNDLE_BEE_TESTS', tests['bee_test_count'])
          print('V10_V7_MATERIALISED false')
          PY
      - name: Upload resolved metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-real-video-source-resolution
          path: |
            .v10/source-resolution.json
            .v10/honeybee-videos-index.json
            .v10/experiment-data-index.json
            .v10/experiment-data-index.log
            .v10/experiment-test-videos-index.json
          if-no-files-found: error
          retention-days: 30
