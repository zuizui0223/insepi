name: V10 container metadata probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-byte-frozen-mp4-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-probe all seven byte-frozen MP4 containers without pixel decoding
        run: python scripts/probe_v10_video_container_metadata.py
      - name: Audit against frozen container summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('.v10/v10_container_metadata.json').read_text())
          frozen = json.loads(Path('benchmarks/v10_container_metadata_summary.json').read_text())
          assert obj['video_count'] == 7
          assert obj['parser'] == frozen['parser']
          assert obj['video_pixels_decoded'] is False
          assert obj['observer_execution'] is False
          assert obj['v7_materialisation'] is False
          actual = [(row['metadata']['frame_sample_count'], row['metadata']['duration_seconds'], row['metadata']['average_fps_from_stts']) for row in obj['videos']]
          expected = [(row['frame_count'], row['duration_seconds'], frozen['common']['fps']) for row in frozen['videos']]
          assert actual == expected
          print('V10_CONTAINER_METADATA_MATCHES_LOCK true')
          print('V10_VIDEO_PIXELS_DECODED false')
          print('V10_OBSERVER_EXECUTION false')
          PY
      - name: Upload container metadata only
        uses: actions/upload-artifact@v4
        with:
          name: v10-container-metadata
          path: .v10/v10_container_metadata.json
          if-no-files-found: error
          retention-days: 30
