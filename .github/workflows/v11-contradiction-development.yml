name: V11 contradiction-guided development

# Canonical first result already exists (run 32696262650, result SHA-256
# 654d0be81c459f11d35b37ca91fa7251f395e352a31f44993384bac92b1107c1).
# Keep this workflow manual-only so later documentation/diagnostic changes cannot
# be mistaken for repeated scientific exploration.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
      - name: Install pinned runtime
        run: |
          python -m pip install "numpy==2.4.6"
          python -m pip install -e ".[dev]"
          python - <<'PY'
          import platform, numpy as np
          assert platform.python_version() == '3.11.16'
          assert np.__version__ == '2.4.6'
          print('V11_PINNED_RUNTIME PASS', platform.python_version(), np.__version__)
          PY
      - name: Verify frozen protocol and canonical-result identity
        run: |
          python - <<'PY'
          import json
          p=json.load(open('benchmarks/v11_contradiction_development_protocol.json'))
          r=json.load(open('benchmarks/v11_contradiction_development_result_summary.json'))
          assert p['status']=='pre-result-frozen'
          assert r['status']=='canonical-first-run-frozen'
          assert r['workflow_run_id']==32696262650
          assert r['protocol_sha256']=='af358226f4afccff3bb148e90a30c5fe9a25c2170d3f223497a22fb3dd685080'
          assert r['result_sha256']=='654d0be81c459f11d35b37ca91fa7251f395e352a31f44993384bac92b1107c1'
          assert r['claim']=={'level':'D','label':'no_general_localisation_advantage'}
          print('V11_CANONICAL_NEGATIVE_RESULT_FROZEN PASS')
          PY
          pytest -q tests/test_contradiction_development_v11.py
      - name: Re-run only as explicit reproducibility check
        env:
          PYTHONPATH: src
        run: |
          mkdir -p .v11/a .v11/b
          PYTHONHASHSEED=11 python scripts/run_v11_contradiction_development.py --output .v11/a/v11_result.json | tee .v11/a/console.txt
          PYTHONHASHSEED=97 python scripts/run_v11_contradiction_development.py --output .v11/b/v11_result.json | tee .v11/b/console.txt
      - name: Require exact canonical identity
        run: |
          expected="654d0be81c459f11d35b37ca91fa7251f395e352a31f44993384bac92b1107c1"
          sha_a="$(sha256sum .v11/a/v11_result.json | awk '{print $1}')"
          sha_b="$(sha256sum .v11/b/v11_result.json | awk '{print $1}')"
          test "$sha_a" = "$expected" || { echo "V11 canonical drift: $sha_a"; exit 1; }
          test "$sha_b" = "$expected" || { echo "V11 canonical drift: $sha_b"; exit 1; }
          echo "V11_CANONICAL_REPRODUCIBILITY PASS $expected"
