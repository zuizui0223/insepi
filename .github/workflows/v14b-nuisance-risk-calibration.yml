name: V14b nuisance risk calibration locked run

on:
  push:
    branches:
      - feature/v14b-nuisance-risk-calibration
    paths:
      - '.github/v14b_nuisance_risk_once'
      - '.github/workflows/v14b-nuisance-risk-calibration.yml'

permissions:
  contents: read

jobs:
  calibrate-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          check-latest: false
      - name: Install frozen runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.4.6" -e ".[dev]"
      - name: Verify one-shot marker and contract tests
        run: |
          test "$(cat .github/v14b_nuisance_risk_once)" = "RUN_ONCE_V14B_NUISANCE_RISK_CALIBRATION"
          pytest -q tests/test_v14b_nuisance_risk_calibration.py
      - name: Run negative-only calibration and held-out validation exactly once
        run: |
          python scripts/run_v14b_nuisance_risk_calibration.py --output v14b_nuisance_risk_output/result.json
      - name: Build immutable receipt
        run: |
          python - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          import numpy as np
          out=Path('v14b_nuisance_risk_output/result.json')
          payload=json.loads(out.read_text())
          receipt={
            'schema':'insepi-v14b-nuisance-risk-calibration-receipt-v1',
            'execution_commit':os.environ['GITHUB_SHA'],
            'runtime':{'python':platform.python_version(),'numpy':np.__version__},
            'result_sha256':hashlib.sha256(out.read_bytes()).hexdigest(),
            'alpha':payload['alpha'],
            'calibrated_threshold':payload['calibrated_threshold'],
            'heldout_target_only_fpr':payload['heldout_target_only_fpr'],
            'heldout_target_coupled_fpr':payload['heldout_target_coupled_fpr'],
            'heldout_nuisance_coverage':payload['heldout_nuisance_coverage'],
            'new_contradiction_type_count':payload['new_contradiction_type_count'],
            'nuisance_decision_contract_freezable':payload['nuisance_decision_contract_freezable'],
            'target_observer_modified':payload['target_observer_modified'],
            'nuisance_feature_representation_modified':payload['nuisance_feature_representation_modified'],
          }
          Path('v14b_nuisance_risk_output/receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          PY
      - name: Upload immutable nuisance risk result
        uses: actions/upload-artifact@v4
        with:
          name: v14b-nuisance-risk-calibration-first-run
          path: v14b_nuisance_risk_output/
