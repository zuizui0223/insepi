name: V8 generality benchmark

on:
  pull_request:
    paths:
      - "benchmarks/v8_generality_protocol.json"
      - "docs/V8_GENERALITY_BENCHMARK_PROTOCOL.md"
      - "src/interaction_sensing/finite_budget_guarantees.py"
      - "src/interaction_sensing/simulation/generality_v8.py"
      - "scripts/run_v8_generality.py"
      - "tests/test_finite_budget_guarantees.py"
      - "tests/test_generality_v8.py"
      - "tests/test_generality_v8_determinism.py"
      - ".github/workflows/v8-generality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Verify no-tuning, finite-budget, and hash-seed contracts
        run: |
          pytest -q \
            tests/test_finite_budget_guarantees.py \
            tests/test_generality_v8.py \
            tests/test_generality_v8_determinism.py
      - name: Run full pre-registered V8 twice under distinct hash seeds
        run: |
          PYTHONHASHSEED=1 python scripts/run_v8_generality.py --output-dir .v8/run-a
          PYTHONHASHSEED=987654 python scripts/run_v8_generality.py --output-dir .v8/run-b
      - name: Require byte-identical full V8 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil

          a = json.loads(Path('.v8/run-a/v8_generality_manifest.json').read_text())
          b = json.loads(Path('.v8/run-b/v8_generality_manifest.json').read_text())
          keys = (
              'protocol_sha256',
              'result_sha256',
              'metrics_csv_sha256',
              'applicability_csv_sha256',
              'slices_csv_sha256',
          )
          for key in keys:
              assert a[key] == b[key], (key, a[key], b[key])
          target = Path('.v8/generality')
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree('.v8/run-a', target)
          print('V8_BYTE_IDENTICAL_RERUN true')
          print('V8_CANONICAL_RESULT_SHA256', a['result_sha256'])
          PY
      - name: Audit V8 output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(Path('benchmarks/v8_generality_protocol.json').read_text())
          result = json.loads(Path('.v8/generality/v8_generality_result.json').read_text())
          manifest = json.loads(Path('.v8/generality/v8_generality_manifest.json').read_text())
          assert result['headline']['regime_count'] == 864
          assert manifest['frozen_candidate'] == protocol['frozen_candidate']
          assert manifest['frozen_candidate'] == {
              'exploration': 0.50,
              'evidence': 0.10,
              'observability': 0.40,
              'disagreement': 0.00,
          }
          assert len(result['applicability']) == 864
          assert len(result['quality_correlation_slices']) == 27
          assert not Path('.v7/run/v7_pixels.npz').exists()
          print('V8_NO_V7_MATERIALISATION true')
          print('V8_FROZEN_WEIGHTS_UNCHANGED true')
          PY
      - name: Upload V8 characterization artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v8-generality-characterization
          path: .v8/generality/
          if-no-files-found: error
          retention-days: 90
