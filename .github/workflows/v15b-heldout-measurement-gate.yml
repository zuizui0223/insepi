name: V15b held-out measurement gate

on:
  pull_request:
    paths:
      - "src/interaction_sensing/heldout_measurement_v15b.py"
      - "src/interaction_sensing/visit_systems.py"
      - "scripts/v15b_predict_and_commit.py"
      - "scripts/v15b_evaluate_locked.py"
      - "benchmarks/v15b_heldout_measurement_gate_protocol.json"
      - "benchmarks/v15b_heldout_measurement_freeze_TEMPLATE.json"
      - "tests/test_v15b_heldout_measurement_gate.py"
      - "tests/test_visit_systems.py"
      - "docs/V15B_HELDOUT_MEASUREMENT_GATE.md"
      - ".github/workflows/v15b-heldout-measurement-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-peek-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Verify superposition and no-peek measurement boundary
        run: |
          pytest -q \
            tests/test_observation_triad.py \
            tests/test_visit_systems.py \
            tests/test_layered_visit_truth.py \
            tests/test_support_truth.py \
            tests/test_support_estimation.py \
            tests/test_v15b_heldout_measurement_gate.py
      - name: Assert repository contains no executable field freeze or result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          protocol = json.loads(
              Path("benchmarks/v15b_heldout_measurement_gate_protocol.json").read_text()
          )
          template = json.loads(
              Path("benchmarks/v15b_heldout_measurement_freeze_TEMPLATE.json").read_text()
          )
          assert protocol["status"] == "software-contract-prefrozen-no-field-execution-authorized"
          assert protocol["prediction_stage"]["heldout_truth_read"] is False
          assert protocol["prediction_stage"]["full_triad_policy"] == "ProcessPreservingObservationTriadPolicy"
          assert protocol["current_evaluation_ceiling"]["familywise_hypothesis_tests_executed"] == 0
          assert protocol["execution_gate"]["committed_real_heldout_result_present"] is False
          assert template["status"] == "TEMPLATE_NOT_EXECUTABLE"
          assert not list(Path("benchmarks").glob("v15b_*_FIELD_RESULT.json"))
          print("V15B_NO_PEEK_SOFTWARE_GATE PASS")
          print("V15B_FIELD_RESULT_PRESENT false")
          PY
