name: V12 causal intervention development

on:
  pull_request:
    paths:
      - "benchmarks/v12_causal_intervention_protocol.json"
      - "src/interaction_sensing/simulation/causal_intervention_v12.py"
      - "tests/test_causal_intervention_v12.py"
      - "scripts/run_v12_causal_intervention.py"
      - "docs/V12_PRE_RESULT_FREEZE.md"
      - ".github/workflows/v12-causal-intervention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-v12:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"

      - name: Install pinned runtime
        run: |
          python -m pip install "numpy==2.4.6"
          python -m pip install -e ".[dev]"
          python - <<'PY'
          import platform, numpy as np
          assert platform.python_version() == '3.11.16'
          assert np.__version__ == '2.4.6'
          print('V12_PINNED_RUNTIME PASS', platform.python_version(), np.__version__)
          PY

      - name: Verify pre-result protocol and implementation contracts
        run: |
          python - <<'PY'
          import json
          p=json.load(open('benchmarks/v12_causal_intervention_protocol.json'))
          assert p['status']=='pre-result-frozen'
          assert p['historical_boundaries']['v7_locked_gate']=='FAIL'
          assert p['historical_boundaries']['v11_locked_claim_level']=='D'
          assert p['historical_boundaries']['v11_result_sha256']=='654d0be81c459f11d35b37ca91fa7251f395e352a31f44993384bac92b1107c1'
          assert p['interventions']['active_intervention_budget']==2
          assert p['common_diagnostic_algorithm']['same_algorithm_for_all_representations'] is True
          print('V12_PRE_RESULT_PROTOCOL PASS')
          PY
          pytest -q tests/test_causal_intervention_v12.py

      - name: Run frozen V12 twice under distinct hash seeds
        env:
          PYTHONPATH: src
        run: |
          mkdir -p .v12/a .v12/b
          PYTHONHASHSEED=12 python scripts/run_v12_causal_intervention.py --output .v12/a/v12_result.json | tee .v12/a/console.txt
          PYTHONHASHSEED=1201 python scripts/run_v12_causal_intervention.py --output .v12/b/v12_result.json | tee .v12/b/console.txt

      - name: Require byte-identical result and preserve first canonical copy
        run: |
          sha_a="$(sha256sum .v12/a/v12_result.json | awk '{print $1}')"
          sha_b="$(sha256sum .v12/b/v12_result.json | awk '{print $1}')"
          test "$sha_a" = "$sha_b" || { echo "V12 result nondeterminism: $sha_a != $sha_b"; exit 1; }
          mkdir -p .v12/canonical
          cp .v12/a/v12_result.json .v12/canonical/
          cp .v12/a/console.txt .v12/canonical/
          cp benchmarks/v12_causal_intervention_protocol.json .v12/canonical/
          cp docs/V12_PRE_RESULT_FREEZE.md .v12/canonical/
          printf '%s\n' "$sha_a" > .v12/canonical/result_sha256.txt
          echo "V12_BYTE_DETERMINISM PASS $sha_a"

      - name: Summarize frozen V12
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('.v12/canonical/v12_result.json'))
          print('# V12 controlled causal intervention benchmark')
          print()
          print(f"- Claim: **{r['claim']['level']}** — `{r['claim']['label']}`")
          for name,m in r['strategies'].items():
              print(f"- {name}: localisation `{m['heldout_localisation_accuracy_budget2']:.3f}`, full battery `{m['heldout_full_battery_localisation_accuracy']:.3f}`, shared `{m['shared_representation_recall_budget2']:.3f}`, wrong `{m['wrong_module_intervention_rate_budget2']:.3f}`, repair+ `{m['heldout_repair_positive_transfer_rate']:.3f}`")
          print('- V7 retained: **FAIL/C**')
          print('- V11 retained: **FAIL/D**')
          print('- V6 weights changed: **false**')
          print('- V10 changed: **false**')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v12-causal-intervention-first-run
          path: .v12/canonical/
          if-no-files-found: error
          retention-days: 90
