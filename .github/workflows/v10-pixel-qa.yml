name: V10 post-freeze pixel QA

on:
  pull_request:
    paths:
      - "scripts/v10_preobserver_pixel_qa.py"
      - "scripts/v10_panel_overlap_qa.py"
      - "benchmarks/v10_preobserver_pixel_qa_summary.json"
      - "benchmarks/v10_panel_overlap_qa_summary.json"
      - ".github/workflows/v10-pixel-qa.yml"
      - "docs/V10_PREOBSERVER_PIXEL_QA.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V10_PIXEL_RUN_ID: "32616509747"
  V10_PIXEL_ARTIFACT: v10-frozen-real-pixel-artifact

jobs:
  descriptive-pixel-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen array runtime only
        run: python -m pip install numpy==2.4.6
      - name: Download already-frozen canonical V10 pixels
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V10_PIXEL_ARTIFACT }}
          path: .v10/artifact-download
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.V10_PIXEL_RUN_ID }}
      - name: Locate artifact and run observer-free QA
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(find .v10/artifact-download -name v10_real_pixel_receipt.json -print -quit)"
          test -n "$receipt"
          root="$(dirname "$receipt")"
          python scripts/v10_preobserver_pixel_qa.py \
            --artifact-dir "$root" \
            --output .v10/v10_preobserver_pixel_qa.json
          python scripts/v10_panel_overlap_qa.py \
            --panel-registry "$root/v10_panel_registry.json" \
            --output .v10/v10_panel_overlap_qa.json
      - name: Match committed descriptive summaries
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          actual = json.loads(Path('.v10/v10_preobserver_pixel_qa.json').read_text())
          expected = json.loads(Path('benchmarks/v10_preobserver_pixel_qa_summary.json').read_text())
          assert actual['status'] == expected['status']
          assert actual['observer_execution'] is False
          assert actual['scientific_protocol_changed'] is False
          for key in ('canonical_pixel_npz_sha256','condition_registry_sha256','panel_registry_sha256'):
              assert actual[key] == expected[key]
          aa, ee = actual['panel_assignment'], expected['panel_assignment']
          for key in ('panel_count','disturbed_per_panel','panels_with_missing_video_category','panels_with_missing_video_temporal_quartile_category'):
              assert aa[key] == ee[key]
          for key in ('video_tv_mean','video_tv_max','video_temporal_quartile_tv_mean','video_temporal_quartile_tv_max'):
              assert math.isclose(aa[key], ee[key], rel_tol=0.0, abs_tol=1e-15)
          missing = [
              (row['panel_id'], item['video_index'], item['temporal_quartile'], item['full_window_count'])
              for row in aa['panels']
              for item in row['missing_video_temporal_quartile_categories']
          ]
          detail = ee['missing_video_temporal_quartile_detail']
          assert missing == [(detail['panel_id'], detail['video_index'], detail['temporal_quartile'], detail['full_window_count'])]
          pp, ep = actual['perturbation_pixel_diagnostics'], expected['perturbation_pixel_diagnostics']
          assert pp['all_family_median_mae_nondecreasing_by_tier'] is True
          for family, expected_values in ep['family_median_mae_by_tier'].items():
              actual_values = [row['median_mae'] for row in pp['rows'] if row['family'] == family]
              assert len(actual_values) == 3
              for a, e in zip(actual_values, expected_values, strict=True):
                  assert math.isclose(a, e, rel_tol=0.0, abs_tol=1e-12)
          for family, expected_diag in ep['family_window_mae_nondecreasing'].items():
              actual_diag = pp['family_window_and_video_monotonicity'][family]
              assert actual_diag['window_count_nondecreasing'] == expected_diag['count']
              assert actual_diag['window_count_total'] == expected_diag['total']
              assert math.isclose(actual_diag['window_fraction_nondecreasing'], expected_diag['fraction'], rel_tol=0.0, abs_tol=1e-15)
              assert actual_diag['video_median_nondecreasing_count'] == expected_diag['video_median_nondecreasing_count']
              assert actual_diag['video_count'] == expected_diag['video_count']
          assert math.isclose(pp['minimum_over_all_variants_of_min_window_mae'], ep['minimum_over_all_variants_of_min_window_mae'], rel_tol=0.0, abs_tol=1e-12)
          assert math.isclose(pp['maximum_over_all_variants_of_max_window_saturation_fraction'], ep['maximum_over_all_variants_of_max_window_saturation_fraction'], rel_tol=0.0, abs_tol=1e-15)

          overlap = json.loads(Path('.v10/v10_panel_overlap_qa.json').read_text())
          overlap_expected = json.loads(Path('benchmarks/v10_panel_overlap_qa_summary.json').read_text())
          assert overlap['observer_execution'] is False
          for key in (
              'panel_pair_count','min_pairwise_overlap','max_pairwise_overlap',
              'window_panel_exposure_min','window_panel_exposure_max',
              'windows_never_disturbed','windows_always_disturbed',
          ):
              assert overlap[key] == overlap_expected[key]
          for key in (
              'independent_half_assignment_expected_overlap','mean_pairwise_overlap',
              'mean_pairwise_phi','min_pairwise_phi','max_pairwise_phi',
              'window_panel_exposure_mean',
          ):
              assert math.isclose(overlap[key], overlap_expected[key], rel_tol=0.0, abs_tol=1e-15)
          assert overlap['window_panel_exposure_histogram'] == overlap_expected['window_panel_exposure_histogram']

          assert not Path('.v10/run/pollipi_v10_trace.jsonl').exists()
          assert not Path('.v10/run/insepi_v10_trace.jsonl').exists()
          assert not Path('.v10/run/v10_report.json').exists()
          print('V10_POST_FREEZE_PIXEL_QA MATCH')
          print('V10_TIER_GEOMETRY_QA MATCH')
          print('V10_PANEL_OVERLAP_QA MATCH')
          print('V10_OBSERVER_EXECUTION false')
          print('V10_CLAIM_GATE_CHANGED false')
          PY
      - name: Upload descriptive QA only
        uses: actions/upload-artifact@v4
        with:
          name: v10-post-freeze-pixel-qa
          path: |
            .v10/v10_preobserver_pixel_qa.json
            .v10/v10_panel_overlap_qa.json
          if-no-files-found: error
          retention-days: 90
